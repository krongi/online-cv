  projects:
    title: Notable Projects
    intro: >
      Below are some of the key projects I've undertaken, showcasing my expertise in both technology and innovation. 
      These projects span from software development to hardware engineering, each highlighting my ability to deliver 
      impactful solutions.

  assignments:
    - title: Barbarian Charlemagne (In Progress)
      tagline: >
        An ESP32 wired and flashed to perform like a 'Bad USB'. When plugged in, it will begin doing keylogging as well as periodic screenshots. It will also store mouse coordinates 
        when clicking the mouse and will diferentiate between a right and left click. It also hosts a webserver and creates an ad-hoc network to allow connection to the device for data exfiltration
        or other uses. This was another project that already exists, but I don't want to pay for and I feel like I can whip something up comparable. Maybe not as stealthy, but functionally on the same
        level
        
    - title: Regular Game (In Progress)
      tagline: >
        An HTML5 game developed using the Phaser 3 framework. Currently a solo project, it's a demonstration of my coding 
        skills and creativity in game development.
      link: >
        https://github.com/krongi/RegularGame
    
    - title: Sunbiz Detail Scraper
      tagline: >
        A python based scraper for pulling data from sunbiz and placing into a sqlite database. 
        https://github.com/krongi/SunbizDetailGrabber

    - title: LoRa Launcher
      tagline: >
          A hardware device using ESP32 and LoRa to facilitate the launching of dangerous fireworks/rockets from a safe distance, 
          several feet or miles from the staging and launching area

    - title: Spaz Mouse (Completed)
      tagline: >
        A hardware solution designed to prevent computers from timing out. This project involved designing and building 
        a physical device that mimics mouse movements. 
        https://github.com/krongi/SpazMouse

    - title: SMS Bomber (Completed)
      tagline: >
        A Tasker-based Android tool developed to send repeated SMS messages to a target number. This project was an exercise 
        in automation and task management on mobile platforms. 
        https://github.com/krongi/SMSBomber

    - title: GVClick
      tagline: >
          An android app based on tasker to automatically and repeatedly call someone using Google Voice. Set it and forget it
          https://github.com/krongi/GVClick

    - title: PolyTank Water Change System (In Progress)
      tagline: >
        An automated water change system for aquariums, designed to manage three tanks with minimal human intervention. 
        This project combines my skills in hardware design and software control systems.


career-profile:
  title: Career Profile
  summary: > 
    Results-driven IT consultant with over 20 years of experience in network security, cloud infrastructure management, and full-stack development. Specializing in delivering cutting-edge automation, cybersecurity solutions, and cloud migrations, reducing costs by 30%. Proven expertise in utilizing AI to enhance business processes and optimizing technical infrastructures for a wide range of clients, from small businesses to large enterprises. Adept at leading complex projects and ensuring uptime, security, and scalability for mission-critical systems.


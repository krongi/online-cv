career-profile:
  title: Career Profile
  summary: >
    A passionate technology expert with a career spanning from hands-on projects to professional systems engineering. 
    My journey began with small-scale troubleshooting and has evolved into a robust skill set in systems engineering, 
    virtualization, and network security. Continuously learning and adapting, I stay at the forefront of industry trends 
    and emerging technologies, ensuring that I deliver cutting-edge solutions to meet the complex needs of modern enterprises.

experiences:
  title: Professional Experience
  info:
    - role: Systems Engineer
      time: 2021 - Present
      company: Objective Intel, Winter Park, FL
      details: >
        Serving as a comprehensive Technology Consultant and Service Provider, I am responsible for a wide array of IT services,
        including infrastructure setup, network security, virtualization, and custom electronic solutions. 
        Key responsibilities include:
        - Managing and maintaining firewalls, VPNs, and Active Directory environments
        - Conducting pentests and security scans using Kali Linux tools
        - Providing on-site consultations for client technology needs
        - Designing and deploying custom servers and electronic devices
        - Offering break/fix services for a variety of client hardware
        - Sourcing and implementing components for complex technical projects
        - Creating custom scripts and automation to enhance operational efficiency

    - role: Systems Administrator
      time: 2013 - 2021
      company: Rackspace, Orlando, FL
      details: >
        As a Systems Administrator at Rackspace, I played a pivotal role in ensuring the stability and security of IT infrastructure 
        for a variety of clients. My work involved:
        - Managing server environments, including backups, patching, and monitoring
        - Configuring and maintaining virtualized environments using VMWare and Hyper-V
        - Performing security audits, network scans, and vulnerability assessments
        - Automating repetitive tasks with PowerShell and bash scripts
        - Creating and managing Group Policy Objects (GPOs) with a focus on security
        - Leading successful migrations, including a critical Exchange migration under tight deadlines
        - Developing innovative solutions like a custom PowerShell script that saved significant time in user deactivation processes

projects:
  title: Notable Projects
  intro: >
    Below are some of the key projects I've undertaken, showcasing my expertise in both technology and innovation. 
    These projects span from software development to hardware engineering, each highlighting my ability to deliver 
    impactful solutions.

  assignments:
    - title: Gangland Takeover (In Progress)
      tagline: >
        An HTML5 game developed using the Phaser 3 framework. Currently a solo project, it's a demonstration of my coding 
        skills and creativity in game development.

    - title: Zombie Mouse (Completed)
      tagline: >
        A hardware solution designed to prevent computers from timing out. This project involved designing and building 
        a physical device that mimics mouse movements.

    - title: SMS Bomber (Completed)
      tagline: >
        A Tasker-based Android tool developed to send repeated SMS messages to a target number. This project was an exercise 
        in automation and task management on mobile platforms.

    - title: PolyTank Water Change System (In Progress)
      tagline: >
        An automated water change system for aquariums, designed to manage three tanks with minimal human intervention. 
        This project combines my skills in hardware design and software control systems.


  title: Career Profile
  summary: >
    I am a seasoned Systems Engineer with over 15 years of experience in technology, specializing in 
    infrastructure management, network security, and IT consulting. My expertise spans across various 
    industries, with a focus on delivering customized solutions to meet complex client needs. I am passionate 
    about leveraging my deep technical knowledge to solve challenging problems and drive business growth.

experiences:
  title: Professional Experience
  info:
    - role: Systems Engineer
      time: Aug 2020 - Present
      company: Objective Intel, Winter Park, FL
      details: >
        - Provide IT consulting services, focusing on optimizing clients' current hardware and software.
        - Recommend upgrades, migrations, security enhancements, cloud solutions, and software integration.
        - Conduct network scans, vulnerability assessments, and physical/virtual infrastructure upgrades.
        - Maintain client infrastructure, perform server builds, decoms, and ensure backups.
        - Field phone calls from users and assist remotely or in-person as needed.

    - role: Systems Engineer
      time: Apr 2019 - Jun 2022
      company: Starnes Consulting, Orlando, FL
      details: >
        - Plan, deploy, and maintain IT infrastructure for various clients, including server migrations and decoms.
        - Ensure backups are completed successfully and troubleshoot hardware issues.
        - Provide remote and on-site support to users, replacing and reconfiguring failed equipment as needed.

    - role: Customer Support Technician
      time: Mar 2020 - Feb 2021
      company: Atlantic.Net Inc., Orlando, FL
      details: >
        - Provided client support, handling support calls and emails.
        - Assisted clients with firewall rule changes, system deployment, and upgrades.
        - Resolved issues with in-house Docker stack deployments, including system pruning, error resolution, and redeployment.

    - role: Systems Engineer (Contract)
      time: Oct 2019 - Nov 2019
      company: ThreatLocker, Orlando, FL
      details: >
        - Conducted external audits, network scans, and vulnerability assessments.
        - Provided recommendations for physical and virtual infrastructure upgrades, including SQL Server Always On.

    - role: Systems Engineer
      time: Aug 2016 - Apr 2019
      company: UnbreakableIT, Orlando, FL
      details: >
        - Managed general sysadmin duties, including password resets, backups, and data recovery.
        - Administered Connectwise Automate, Azure AD, and Office 365 environments.
        - Managed Exchange servers for various clients, handling upgrades and migrations.

    - role: System Administrator
      time: Jan 2012 - Feb 2016
      company: Automotive Services Network, Winter Park, FL
      details: >
        - Managed and maintained servers and network equipment, including Exchange, SCCM, and SQL servers.
        - Performed virtualization using Hyper-V, managed backups with Backup Exec, and handled server migrations.

    - role: Master Repair Tech
      time: Oct 2009 - Jan 2012
      company: Refresh Computers and Electronics, Longwood, FL
      details: >
        - Configured and repaired PCs, assembled computers, and performed hardware/software upgrades.
        - Specialized in virus/spyware removal, data recovery, and OS re-installations.
        - Repaired laptops, replaced components, and provided customer support.

    - role: Cable Technician
      time: Feb 2006 - Dec 2007
      company: G.I. Broadband, LLC
      details: >
        - Installed residential and commercial cable and internet services.
        - Diagnosed and repaired computer and internet issues, and installed coax and Cat-5 networking cables.
        - Provided customer service, troubleshooting network connectivity and OS-related issues.

projects:
  title: Notable Projects
  intro: >
    Below are some of the key projects I've undertaken, showcasing my expertise in both technology and innovation. 
    These projects span from software development to hardware engineering, each highlighting my ability to deliver 
    impactful solutions.

  assignments:
    - title: Regular Game (In Progress)
      tagline: >
        An HTML5 game developed using the Phaser 3 framework. Currently a solo project, it's a demonstration of my coding 
        skills and creativity in game development.
      link: >
        https://github.com/krongi/RegularGame
    
    - title: Sunbiz Detail Scraper
      tagline: >
        A python based scraper for pulling data from sunbiz and placing into a sqlite database.
      link: >
        https://github.com/krongi/SunbizDetailGrabber

    - title: LoRa Launcher
      tagline: >
          A hardware device using ESP32 and LoRa to facilitate the launching of dangerous fireworks/rockets from a safe distance, 
          several feet or miles from the staging and launching area

    - title: Spaz Mouse (Completed)
      tagline: >
        A hardware solution designed to prevent computers from timing out. This project involved designing and building 
        a physical device that mimics mouse movements.
      link: > 
        https://github.com/krongi/SpazMouse

    - title: SMS Bomber (Completed)
      tagline: >
        A Tasker-based Android tool developed to send repeated SMS messages to a target number. This project was an exercise 
        in automation and task management on mobile platforms.
      link: >
        https://github.com/krongi/SMSBomber

    - title: GVClick
      tagline: >
          An android app based on tasker to automatically and repeatedly call someone using Google Voice. Set it and forget it
      link: >
          https://github.com/krongi/GVClick

    - title: PolyTank Water Change System (In Progress)
      tagline: >
        An automated water change system for aquariums, designed to manage three tanks with minimal human intervention. 
        This project combines my skills in hardware design and software control systems.

